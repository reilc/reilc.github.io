title: Reil's CTF Notebook
description: >-
  Writeups, thought process, and lessons learned working through picoCTF
  and other CTF challenges — binary exploitation, forensics, cryptography,
  and whatever else comes up along the way.
baseurl: "" # leave empty unless you use a project page like /ctf-blog
url: "" # fill in after you know your github.io URL, e.g. "https://yourusername.github.io"

theme: minima

# Minima adds a few extra nav links / footer icons if you fill these in.
# All optional — delete any you don't want.
minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/yourusername" }

# Organizes posts by category in the URL, e.g. /pwn/2026/08/12/title/
permalink: /:categories/:year/:month/:day/:title/

plugins:
  - jekyll-feed

# Categories you'll likely use — not enforced, just for your own reference
# pwn, forensics, crypto, web, reverse-engineering, misc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - _drafts
